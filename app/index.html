<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="청소노트">
<title>반짝 청소노트</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 스플래시: 단색 배경 + 가운데 로고 -->
<div id="splash">
  <div class="splash-logo">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M16 30 32 17l16 13v17a2 2 0 0 1-2 2H18a2 2 0 0 1-2-2z" fill="#4A2C12"/>
      <path d="M32 29.5l2.2 5 5 2.2-5 2.2-2.2 5-2.2-5-5-2.2 5-2.2z" fill="#FFD000"/>
      <path d="M48 9l1.4 3.4 3.4 1.4-3.4 1.4L48 18.6l-1.4-3.4-3.4-1.4 3.4-1.4z" fill="#FFD000"/>
      <path d="M14 13l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" fill="#FFD000"/>
    </svg>
  </div>
  <p class="splash-name">반짝 청소노트</p>
</div>

<main id="app"></main>

<nav id="tabbar">
  <button class="tab" data-go="home" data-tab="home">
    <svg class="i" viewBox="0 0 24 24"><path d="M4 10.2 12 4l8 6.2V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg>홈
  </button>
  <button class="tab" data-go="schedule" data-tab="schedule">
    <svg class="i" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="3"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>일정
  </button>
  <button class="fab-wrap" data-action="fab">
    <span class="fab"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>일정추가
  </button>
  <button class="tab" data-go="customers" data-tab="customers">
    <svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.5"/><path d="M3 19c.8-3.2 3.2-5 6-5s5.2 1.8 6 5M16 5a3.5 3.5 0 0 1 0 7M18 14.5c1.5.7 2.6 2.2 3 4.5"/></svg>고객
  </button>
  <button class="tab" data-go="stats" data-tab="stats">
    <svg class="i" viewBox="0 0 24 24"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg>매출
  </button>
</nav>

<div id="sheet-root"></div>
<div id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
